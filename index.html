<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Venture League · Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F6F2; --card:#FFFFFF; --ink:#131C17; --muted:#5C6963;
    --line:#DBE2DA; --line-soft:#E8EDE7;
    --green:#0B9E63; --green-deep:#076B44; --green-tint:#E2F4EB;
    --amber:#B96A00; --amber-tint:#FBF1E2; --red:#C03A2B; --red-tint:#FBE9E6;
    --violet:#6B4FA0; --violet-tint:#EEE9F7;
    --font-d:'Space Grotesk',sans-serif; --font-b:'Inter',sans-serif; --font-m:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.45}
  header{border-bottom:2px solid var(--ink);background:var(--card);padding:14px 22px}
  .hd{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px}
  .eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep)}
  h1{font-family:var(--font-d);font-weight:700;font-size:23px;letter-spacing:-.01em}
  .qbadge{font-family:var(--font-m);font-size:12px;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;background:var(--green-tint)}
  .wrap{max-width:1360px;margin:0 auto;padding:20px 22px 70px}
  .panel{background:var(--card);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
  .panel-hd{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;gap:6px}
  .panel-hd h2{font-family:var(--font-d);font-size:15px;font-weight:600}
  .panel-hd .tag{font-family:var(--font-m);font-size:10.5px;color:var(--muted)}
  .panel-bd{padding:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
  button{font-family:var(--font-d);font-weight:600;cursor:pointer;border-radius:8px;transition:all .15s}
  .btn{background:var(--ink);color:#fff;border:none;padding:11px 22px;font-size:14px}
  .btn:hover{background:var(--green-deep)}
  .btn.big{font-size:16px;padding:14px 30px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:8px 16px;font-size:12.5px}
  .btn.ghost:hover{border-color:var(--green);color:var(--green-deep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.danger{background:var(--red)}
  .btn.tiny{padding:4px 10px;font-size:11px}
  input,select,textarea{font-family:var(--font-b);font-size:13px;border:1.5px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
  input[type=number]{font-family:var(--font-m)}
  label.f{display:block;font-family:var(--font-m);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-family:var(--font-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:5px 7px;border-bottom:1.5px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:5px 7px;border-bottom:1px solid var(--line-soft);text-align:right;font-family:var(--font-m);font-size:11.5px}
  td:first-child{font-family:var(--font-b);font-weight:600;font-size:12.5px}
  tr.total td{border-top:2px solid var(--ink);font-weight:600}
  .teamdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
  .pill{font-family:var(--font-m);font-size:10.5px;border-radius:999px;padding:3px 10px}
  .pill.ok{background:var(--green-tint);color:var(--green-deep)}
  .pill.wait{background:var(--amber-tint);color:var(--amber)}
  .pill.bot{background:var(--violet-tint);color:var(--violet)}
  .pill.warnp{background:var(--red-tint);color:var(--red)}
  .teamrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line-soft);border-radius:8px;padding:11px 13px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
  .teamrow:hover{border-color:var(--green)}
  .tname{font-family:var(--font-d);font-weight:600;font-size:15px}
  .muted{color:var(--muted)}
  .mono{font-family:var(--font-m)}
  .small{font-size:11.5px}
  .notice{font-size:12px;color:var(--amber);background:var(--amber-tint);border-radius:6px;padding:7px 10px;margin-bottom:10px;display:none}
  .notice.show{display:block}
  .newsline{font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line-soft)}
  .newsline b{font-family:var(--font-d)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--paper);border-radius:8px;padding:9px;text-align:center}
  .kpi .k-l{font-family:var(--font-m);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .kpi .k-v{font-family:var(--font-d);font-weight:700;font-size:18px;margin-top:2px}
  .modelcard{border:1.5px solid var(--line);border-radius:9px;padding:12px;margin-bottom:12px;background:#fff}
  .modelcard.editing{border-color:var(--green)}
  .mc-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .mc-hd .nm{font-family:var(--font-d);font-weight:600;font-size:15px}
  .cfgrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  @media(max-width:760px){.cfgrow{grid-template-columns:1fr 1fr}}
  .cfgrow select{width:100%;font-size:12px}
  .addgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
  @media(max-width:760px){.addgrid{grid-template-columns:1fr 1fr}}
  .addchk{display:flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line-soft);border-radius:6px;padding:5px 7px;cursor:pointer}
  .addchk.dis{opacity:.4;cursor:not-allowed}
  .addchk input{accent-color:var(--green)}
  .qstrip{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .qchip{font-family:var(--font-m);font-size:10.5px;border-radius:6px;padding:4px 8px;background:var(--paper)}
  .qchip b{font-size:11.5px}
  .chip{font-family:var(--font-m);font-size:11px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
  .allocgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  @media(max-width:700px){.allocgrid{grid-template-columns:repeat(3,1fr)}}
  .pl-line{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:12px;padding:3.5px 0;border-bottom:1px dashed var(--line-soft)}
  .pl-line .l{color:var(--muted)}
  .pl-line.strong{border-bottom:1.5px solid var(--ink)}
  .pl-line.strong .l,.pl-line.strong .v{color:var(--ink);font-weight:600}
  .v.neg{color:var(--red)} .v.pos{color:var(--green-deep)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
  .tab{font-family:var(--font-m);font-size:11.5px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sharebarrow{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1.5px solid var(--ink);margin:4px 0 10px}
  .sbseg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-m);font-size:10px;min-width:0;overflow:hidden;white-space:nowrap}
  .cover{position:fixed;inset:0;background:var(--ink);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;text-align:center;padding:30px}
  .cover.show{display:flex}
  .cover h2{font-family:var(--font-d);font-size:30px}
  .cover p{color:#B9C6BE;max-width:440px}
  .podium{display:flex;gap:14px;align-items:flex-end;justify-content:center;margin:26px 0;flex-wrap:wrap}
  .pod{border-radius:10px 10px 0 0;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:12px;min-width:130px}
  .pod .p-nm{font-family:var(--font-d);font-weight:700;font-size:16px}
  .pod .p-sc{font-family:var(--font-m);font-size:12px;opacity:.85}
  .spark{vertical-align:middle}
  .setuprow{display:flex;gap:10px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  .warn{color:var(--red);font-size:11.5px;font-family:var(--font-m)}
  .foot{font-size:11px;color:var(--muted);max-width:1360px;margin:0 auto;padding:0 22px 40px}
  textarea.save{width:100%;height:110px;font-family:var(--font-m);font-size:10.5px;border:1.5px solid var(--line);border-radius:8px;padding:8px}
  .seggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.seggrid{grid-template-columns:1fr}}
  .segcard{border:1.5px solid var(--line);border-radius:10px;padding:13px;background:#fff}
  .segcard h3{font-family:var(--font-d);font-size:15px;margin-bottom:2px}
  .segcard .meta{font-family:var(--font-m);font-size:10.5px;color:var(--muted);margin-bottom:8px}
  .segcard ul{margin:6px 0 8px 16px;font-size:12.5px}
  .segcard li{margin-bottom:3px}
  .stars td{font-size:12px;letter-spacing:1px;color:var(--amber)}
  .stars td:first-child{font-family:var(--font-m);font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .stars td{padding:2px 6px;border-bottom:none}
  .dealtag{display:inline-block;font-size:11px;background:var(--red-tint);color:var(--red);border-radius:5px;padding:2px 7px;margin:2px 3px 0 0}
  .agenda{background:var(--violet-tint);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px}
  .agenda b{font-family:var(--font-d)}
  .sect{font-family:var(--font-d);font-size:14px;margin:20px 0 8px;padding-top:14px;border-top:1.5px solid var(--line-soft)}
  .sect:first-of-type{border-top:none;padding-top:0;margin-top:6px}
  .techcard{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
  .techcard .tn{font-family:var(--font-d);font-weight:600;font-size:13px}
  .techcard.owned{border-color:var(--green);background:var(--green-tint)}
  .techcard.progress{border-color:var(--amber)}
  .contract{border:1.5px dashed var(--violet);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--violet-tint);font-size:12.5px}
  .auditbox{background:var(--red-tint);border:1.5px solid var(--red);border-radius:8px;padding:10px 12px;margin:10px 0}
  .auditbox .warn{display:block;margin-bottom:3px}
  .bsc td:first-child{font-size:11.5px}
  .charterbox{background:var(--paper);border-radius:8px;padding:12px;margin-bottom:12px}
  .charterbox textarea{width:100%;height:52px;font-size:12.5px}

/* ---- v5 additions: auth, dashboard, members, visuals, deep compare ---- */
.authcard{max-width:420px;margin:30px auto}
.memberchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.mchip{font-family:var(--font-m);font-size:10.5px;background:var(--paper);border-radius:999px;padding:3px 9px}
.mchip.you{background:var(--green-tint);color:var(--green-deep);font-weight:600}
.ucard{border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;background:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.ucard:hover{border-color:var(--green)}
.ucard .un{font-family:var(--font-d);font-weight:600;font-size:15px}
.slotgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:800px){.slotgrid{grid-template-columns:1fr}}
.slotcard{border:1.5px solid var(--line-soft);border-radius:8px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.svgwrap{background:var(--paper);border-radius:8px;padding:6px;display:flex;align-items:center;justify-content:center}
.bikepreview{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0}
.storerow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gaugewrap{display:flex;align-items:center;gap:10px}
.cmp-table{width:100%;overflow-x:auto;display:block}
.cmp-table table{min-width:760px}
.speclbl{font-family:var(--font-m);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dashsplit{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.dashsplit{grid-template-columns:1fr}}
</style>

<body>
<header><div class="hd">
  <div><div class="eyebrow">EV Scooter Startup Simulation · Live Multiplayer</div><h1>EV Venture League <span style="font-weight:500;color:var(--muted);font-size:15px">online</span></h1></div>
  <div class="qbadge" id="qbadge">EV Venture League</div>
</div></header>
<div class="wrap" id="root"></div>
<div class="foot" id="foot"></div>
<script>
"use strict";
const API_URL="https://script.google.com/macros/s/AKfycbztKuZb5IaCS5wpGHcFtNAWw8kd_1C6p9DffSHzOhOBwAwKDlVBpp73FiksAejkbT9r/exec";

const CATALOG = {
  powertrain:{label:"Powertrain",opts:[
    {id:"PT1",name:"PT1 · 7.0 kW (0-40 in 3.3s)",cost:19000},
    {id:"PT2",name:"PT2 · 5.5 kW (0-30 in 3.3s)",cost:14500},
    {id:"PT3",name:"PT3 · 4.2 kW (0-25)",cost:11000},
    {id:"PT4",name:"PT4 · 3.0 kW hub (0-20)",cost:8000}]},
  modes:{label:"Riding modes",opts:[
    {id:"RM1",name:"Eco only (incl.)",cost:0},
    {id:"RM2",name:"+ Ride (needs PT3+)",cost:1500,req:m=>["PT1","PT2","PT3"].includes(m.cfg.powertrain)},
    {id:"RM3",name:"+ Sport (needs PT2+)",cost:3200,req:m=>["PT1","PT2"].includes(m.cfg.powertrain)},
    {id:"RM4",name:"+ Warp (needs PT1)",cost:5500,req:m=>m.cfg.powertrain==="PT1"}]},
  battery:{label:"Battery / charging",opts:[
    {id:"BC1",name:"BC1 · 100 km · 0-80% 60min",cost:40000},
    {id:"BC2",name:"BC2 · 80 km · 0-65% 60min",cost:34500},
    {id:"BC3",name:"BC3 · 75 km · 0-50% 60min",cost:30500},
    {id:"BC4",name:"BC4 · 65 km LFP · 0-40%",cost:25500},
    {id:"BC5",name:"BC5 · 50 km LFP · 0-35%",cost:19000}]},
  tech:{label:"Connected tech",opts:[
    {id:"CT1",name:"CT1 · LCD",cost:1500},
    {id:"CT2",name:"CT2 · TFT + Bluetooth",cost:5000},
    {id:"CT3",name:"CT3 · App + navigation",cost:8500},
    {id:"CT4",name:"CT4 · Touchscreen 4G OTA",cost:13000}]},
  build:{label:"Build / body",opts:[
    {id:"BD1",name:"BD1 · Aluminium + metal",cost:10000},
    {id:"BD2",name:"BD2 · Steel + ABS",cost:6500},
    {id:"BD3",name:"BD3 · Tubular + poly",cost:4000}]},
  wheels:{label:"Wheels",opts:[
    {id:"ALLOY",name:"Alloy",cost:4200},{id:"SPOKE",name:"Steel spoke",cost:2200}]},
  brakes:{label:"Brakes",opts:[
    {id:"BR1",name:"Dual disc + CBS",cost:5800},
    {id:"BR2",name:"Front disc + drum",cost:3600},
    {id:"BR3",name:"Drum + drum",cost:2000}]},
  seat:{label:"Seat",opts:[
    {id:"WIDE",name:"Wide dual-density",cost:2600},{id:"STD",name:"Standard",cost:1200}]},
  susp:{label:"Suspension",opts:[
    {id:"SUS1",name:"Telescopic + adj. mono",cost:6500},
    {id:"SUS2",name:"Telescopic + twin rear",cost:4800},
    {id:"SUS3",name:"Basic spring",cost:2800}]}
};
const ADDONS = [
  {id:"removable",name:"Removable battery",cost:3000,req:m=>["BC3","BC4","BC5"].includes(m.cfg.battery)},
  {id:"regen",name:"Regen braking",cost:2500,req:m=>["PT1","PT2"].includes(m.cfg.powertrain)},
  {id:"boot",name:"34L boot",cost:1800},
  {id:"backrest",name:"Pillion backrest",cost:900},
  {id:"colors",name:"Color pack",cost:800},
  {id:"tpms",name:"TPMS",cost:1500,req:m=>["CT2","CT3","CT4"].includes(m.cfg.tech)},
  {id:"sidestand",name:"Stand cutoff",cost:400},
  {id:"hillhold",name:"Hill-hold",cost:1200,req:m=>["PT1","PT2"].includes(m.cfg.powertrain)},
  {id:"reverse",name:"Reverse assist",cost:1000,req:m=>["PT1","PT2"].includes(m.cfg.powertrain)},
  {id:"theft",name:"Theft alerts",cost:800,req:m=>["CT3","CT4"].includes(m.cfg.tech)},
  {id:"extwarranty",name:"5-yr warranty",cost:2000}
];
const BASE_PLATFORM=14000, ASSEMBLY=4000;

/* R&D technology projects (firm-level; apply to the whole model line once ready).
   fast = ready next quarter; std = ready in two quarters at ~70% of the cost (ASCM-style speed/efficiency tradeoff). */
const TECHS=[
  {id:"T1",name:"HyperCharge platform (0-80% in 18 min)",fx:{charge:2},fast:230,std:160,
   note:"Transforms charging anxiety. Strongest with Urban Tech and Fleet."},

function onTeamData(r){
  G=r;setBadge();
  if(G.phase==="gameover"){renderFinal(G.leaderboard);return;}
  if(G.phase==="results"){renderTeamResults();return;}
  if(G.myTeam.dec.locked){renderTeamWaiting();return;}
  MY=JSON.parse(JSON.stringify(G.myTeam));
  const draft=MY.draft;
  if(draft){
    MY.vision=draft.vision||MY.vision;MY.mission=draft.mission||MY.mission;MY.goals=draft.goals||MY.goals;
    if(draft.prim)MY.prim=draft.prim;if(draft.sec)MY.sec=draft.sec;
    if(draft.hr)MY.hr=draft.hr;
    if(Array.isArray(draft.models)&&draft.models.length){
      const byId={};draft.models.forEach(m=>byId[m.id]=m);
      MY.models=MY.models.map(m=>byId[m.id]?Object.assign({},m,byId[m.id]):m);
      const existingIds=new Set(MY.models.map(m=>m.id));
      draft.models.forEach(m=>{if(!existingIds.has(m.id)){MY.models.push(Object.assign({inv:0,isNew:true},m));existingIds.add(m.id);}});
    }
    if(draft.dec)MY.dec=Object.assign({},MY.dec,draft.dec);
  }
  PENDING.rndStarts=(draft&&draft.dec&&Array.isArray(draft.dec.rndStarts))?draft.dec.rndStarts:MY.rnd.filter(p=>p.qStart===G.quarter).map(p=>({id:p.id,mode:p.mode}));
  MY.rnd=MY.rnd.filter(p=>p.qStart!==G.quarter);
  ui.editModel=null;
  renderTeamDecision();
}
function agendaFor(q,vcq){
  if(q===1)return "<b>Q1 agenda · Organize the firm.</b> Write the vision and mission, declare primary and secondary target segments, study the market survey, and place a cautious first plan. Treat this as a test-market quarter.";
  if(q<vcq-1)return `<b>Q${q} agenda · Test the market.</b> Read customer judgments, refine designs, pricing and campaigns, tune HR packages, keep production modest. Learn cheaply now; scale later.`;
  if(q===vcq-1)return `<b>Q${q} agenda · Prepare the business plan.</b> The venture capitalists arrive next quarter. Review your balanced scorecard and plan how much to ask and what equity to offer.`;
  if(q===vcq)return `<b>Q${q} agenda · Face the venture capitalists.</b> Negotiate equity funding in the VC Room below. Funded firms typically scale capacity, network and R&D from here.`;
  return `<b>Q${q} agenda · Execute and improve.</b> Scale what works: capacity, network, R&D and licensing deals. Strong firms are strong on every scorecard dial, not just profit.`;
}

function scheduleAutosave(){

async function doAutosave(){
  if(!MY||!G||G.myTeam.dec.locked)return;
  const payload={vision:MY.vision,mission:MY.mission,goals:MY.goals,prim:MY.prim,sec:MY.sec,
    hr:{sales:MY.hr.sales,plant:MY.hr.plant},
    models:MY.models.map(m=>({id:m.id,name:m.name,cfg:m.cfg,add:m.add,price:m.price})),

      quality:MY.dec.quality,expBlocks:MY.dec.expBlocks,newCentres:MY.dec.newCentres,hire:MY.dec.hire,
      bankTarget:MY.dec.bankTarget,ltIssue:MY.dec.ltIssue,buyIntel:MY.dec.buyIntel,buyClinic:MY.dec.buyClinic,
      vc:MY.dec.vc,rndStarts:PENDING.rndStarts}};
  try{
    const r=await api("saveDraft",withToken({universeId:SESSION.universeId,payload}));
    const ind=document.getElementById("draftIndicator");

}

function toggleClaim(k){readCharter();MY.dec.claims=MY.dec.claims||[];

function addModel(){
  readCharter();
  if(MY.models.length>=3)return;
  const nm=prompt("Name your new scooter:","Model "+(MY.models.length+1));
  if(nm===null)return;
  const m={id:"M"+Math.random().toString(36).slice(2,7),name:(nm.trim()||"New Model").slice(0,30),
    cfg:{...ARCHETYPES.commuter.cfg},add:{},price:110000,inv:0,isNew:true};
  ADDONS.forEach(a=>m.add[a.id]=a.id==="boot");
  MY.models.push(m);MY.dec.prod[m.id]=0;
  ui.editModel=MY.models.length-1;
  renderTeamDecision();
  tNote("New model added. Rs. 50 L development charge applies this quarter. Allocate production to it and consider raising ad spend.");

function startRnd(id,mode){
  readCharter();
  if(MY.techs.includes(id)||MY.rnd.some(p=>p.id===id)||PENDING.rndStarts.some(p=>p.id===id))return;
  if(MY.rnd.length+PENDING.rndStarts.length>=2){tNote("The lab can run at most two projects at a time (auditor limit). Finish one first.");return;}
  PENDING.rndStarts.push({id,mode});
  renderTeamDecision();
  const tc=techById(id);
  tNote(`${tc.name} will start this quarter (${mode==="fast"?"crash, ready next quarter":"standard, ready in two quarters"}). Rs. ${mode==="fast"?tc.fast:tc.std} L expensed on lock-in.`);
}
function cancelRnd(id){readCharter();PENDING.rndStarts=PENDING.rndStarts.filter(p=>p.id!==id);renderTeamDecision();}
async function makeOffer(){
  readCharter();
  const techId=document.getElementById("licTech").value;
  const buyerI=+document.getElementById("licBuyer").value;
  const fee=Math.max(1,Math.round(+document.getElementById("licFee").value||0));
  busy(true,"Sending offer...");
  const r=await api("offerLicence",withToken({universeId:SESSION.universeId,techId,buyerI,fee}));

  if(!r.ok){tNote(r.error);return;}
  const g=await api("getGame",withToken({universeId:SESSION.universeId}));
  if(g.ok){G.offersIn=g.offersIn;G.offersOut=g.offersOut;}
  renderTeamDecision();tNote(r.note);

  busy(false);

    ${specRow("Sales pkg (% benchmark)",x=>x.hr.sales,market)}
    ${specRow("Plant pkg (% benchmark)",x=>x.hr.plant,market)}
    ${specRow("Technologies",x=>x.techs.length?x.techs.map(id=>techById(id).name.split(" (")[0]).join(", "):"-",market)}
    ${specRow("Reputation",x=>x.rep.toFixed(2),market)}
    ${specRow("Units sold, last quarter",x=>x.units.toLocaleString("en-IN"),market)}
    ${specRow("Market share, last quarter",x=>(x.share*100).toFixed(1)+"%",market)}
  </table></div>`;
  const maxModels=Math.max(...market.map(x=>x.models.length),1);
  let modelBlk="";
  for(let mi=0;mi<maxModels;mi++){
    const rowsCats=Object.keys(CATALOG).map(cat=>specRow(CATALOG[cat].label,x=>{
      const m=x.models[mi];return m?labelOf(cat,m.cfg[cat]):"-";
    },market)).join("");
    const addonRow=specRow("Add-ons",x=>{
      const m=x.models[mi];if(!m)return "-";
      const on=ADDONS.filter(a=>m.add[a.id]).map(a=>a.name);
      return on.length?on.join(", "):"none";
    },market);
    modelBlk+=`<h3 class="sect" style="margin-top:18px">Model slot ${mi+1}</h3>
      <div class="cmp-table"><table>
        <tr><th>Firm</th>${market.map(x=>{const m=x.models[mi];return `<th>${m?m.name:'<span class="muted">—</span>'}</th>`;}).join("")}</tr>
        ${specRow("Price",x=>{const m=x.models[mi];return m?fmtRs(m.price):"-";},market)}
        ${rowsCats}
        ${addonRow}
      </table></div>`;
  }
  return `<p class="small muted">Prices, specs, campaigns, network, technologies and compensation packages are public — exactly what a rival firm's product and HR teams could observe about each other in the real industry. Costs, cash and profit stay private to each firm.</p>
    ${firmTbl}${modelBlk}`;
}

      <div class="small">${nd.price}</div>

           <span class="small muted">Results are live on every team's screen.</span>`}
        <button class="btn ghost" onclick="refreshInstructor()">Refresh</button>

    <div class="panel-bd">${publicReportHTML(rep)}</div></div>

function teamWorkspaceHTML(t){
  const isDraft=!t.dec.locked&&t.draft;
  const src=isDraft?t.draft:{vision:t.vision,mission:t.mission,goals:t.goals,prim:t.prim,sec:t.sec,hr:t.hr,dec:t.dec};
  const modelsForShow=isDraft?(t.draft.models||[]).map(m=>({name:m.name,cfg:m.cfg,add:m.add||{},price:m.price,inv:0})):t.models;
  const bikes=modelsForShow.length?modelsForShow.map(m=>{
    const scores=scoreModel(m,t),cost=unitCost(m);
    const specs=Object.keys(CATALOG).map(cat=>labelOf(cat,m.cfg[cat])).join(" · ");
    const addOns=ADDONS.filter(a=>m.add&&m.add[a.id]).map(a=>a.name);
    return `<div class="modelcard"><div class="bikepreview"><div class="svgwrap">${svgScooter(m,t.color,150)}</div>
      <div style="flex:1;min-width:200px"><div class="nm">${m.name}</div>
      <div class="mono small">Unit cost ${fmtRs(cost)} · Price ${fmtRs(m.price)} · Contribution ${fmtRs(m.price-cost)}</div>
      <div class="qstrip" style="margin-top:6px">${SEGMENTS.map(s=>{const q=qualityFit(scores,s);return `<span class="qchip">${s.name}<br><b>${q.toFixed(2)}</b></span>`;}).join("")}</div>
      <div class="small muted" style="margin-top:5px">${specs}${addOns.length?" + "+addOns.join(", "):""}</div>
      </div></div></div>`;
  }).join(""):'<p class="small muted">No models to show yet.</p>';
  const d=src.dec||{};
  const segName=id=>(SEGMENTS.find(s=>s.id===id)||{}).name||"-";
  return `
    <div class="notice show" style="background:${isDraft?'var(--amber-tint)':t.dec.locked?'var(--green-tint)':'var(--paper)'};color:${isDraft?'var(--amber)':t.dec.locked?'var(--green-deep)':'var(--muted)'}">
      ${isDraft?`<b>Live draft — in progress.</b> Last saved ${src.savedAt?new Date(src.savedAt).toLocaleTimeString():"just now"}${src.savedBy?" by "+src.savedBy:""}. This view refreshes automatically as the team edits.`:
        t.dec.locked?`<b>Locked / submitted</b>${t.dec.lockedBy?" by "+t.dec.lockedBy:""}.`:
        `<b>No draft yet this quarter.</b> Nothing has been edited or saved since the quarter opened.`}
    </div>
    <div class="grid2" style="margin:10px 0">
      <div><label class="f">Vision</label><div class="small">${src.vision||"<span class='muted'>not written yet</span>"}</div></div>
      <div><label class="f">Mission</label><div class="small">${src.mission||"<span class='muted'>not written yet</span>"}</div></div>
    </div>
    <div class="small mono" style="margin-bottom:10px">Target segments: ${segName(src.prim)} (primary) · ${segName(src.sec)} (secondary) ${src.goals?" · Goals: "+src.goals:""}</div>
    <h3 class="sect" style="margin-top:6px">Models</h3>
    ${bikes}
    <h3 class="sect">Marketing, network, finance snapshot</h3>
    <div class="cmp-table"><table>
      <tr><th>Ad budget</th><td>${d.ad!=null?"Rs. "+d.ad+" L":"-"}</td><th>Claims</th><td>${(d.claims||[]).map(k=>CLAIMS[k]).join(", ")||"-"}</td></tr>
      <tr><th>Sales pkg</th><td>${(src.hr||t.hr).sales}% benchmark</td><th>Plant pkg</th><td>${(src.hr||t.hr).plant}% benchmark</td></tr>
      <tr><th>Quality spend</th><td>${d.quality!=null?"Rs. "+d.quality+" L":"-"}</td><th>New centres / hires this qtr</th><td>${d.newCentres||0} / ${d.hire||0}</td></tr>
      <tr><th>Capacity expansion</th><td>${d.expBlocks||0} block(s)</td><th>Bank line target</th><td>${d.bankTarget!=null?"Rs. "+d.bankTarget+" L":"-"}</td></tr>
      <tr><th>R&D starting</th><td colspan="3">${(d.rndStarts||[]).length?d.rndStarts.map(r=>techById(r.id).name+" ("+r.mode+")").join(", "):"-"}</td></tr>
    </table></div>`;
}

<script>
(function(){
  var TIPS = {
    "Powertrain":["Motor power","Drives acceleration and top speed. Higher power lifts appeal for Performance-led segments and unlocks the faster riding modes, but it costs more per unit and cuts range from the same battery."],
    "Riding modes":["Selectable modes","Cheap way to add perceived sophistication. Each mode needs a powertrain strong enough to deliver it, so a weak motor greys the better modes out."],
    "Battery / charging":["Range and charge time","The single biggest cost in the bill of materials and the benefit most segments rate highest. Commuters want range; fleet buyers want fast charging above all."],
    "Connected tech":["Instrumentation","Screen, app and connectivity. Cheap relative to its effect on younger and premium buyers. Almost irrelevant to value-first buyers, who will not pay for it."],
    "Build / body":["Frame and panels","Sets perceived quality and durability. A premium build lifts brand judgment across every segment but raises unit cost on every single vehicle you sell."],
    "Wheels":["Wheel type and size","Affects ride comfort and looks. A visible, low-cost upgrade, which makes it one of the better value-for-money choices on this screen."],
    "Brakes":["Braking system","Safety is judged by every segment and penalised hard when it is weak. Disc and ABS options cost little against the reputational damage of being seen as unsafe."],
    "Seat":["Seat and ergonomics","Comfort matters most to commuters covering distance daily and to fleet riders on the vehicle all day. Barely registers with enthusiasts."],
    "Suspension":["Suspension","Ride quality on poor roads. Undervalued by students and valued highly by commuter and fleet buyers, who feel it on every journey."],
 
    "Vision":["Where you are going","Your own statement of intent. Not scored directly, but it is what you will be held to in the debrief when your decisions contradict it."],
    "Mission":["What you do, for whom, how","Forces you to name a target customer before you design for them. Teams that skip this design for everyone and win nobody."],
    "Top three goals":["Ranked objectives","Rank them honestly. Chasing share and profit and quality at once in early quarters is how firms run out of cash."],
 
    "Primary target segment":["Main customer group","Your design, price and advertising are judged against this segment's stated priorities. Choose before you configure the vehicle, not after."],
    "Secondary target segment":["Second customer group","Market performance is measured across both target segments. A second segment widens demand but splits your design compromises."],
    "Campaign claims":["What your ads promise","Claims are scored on two things: whether the segment values them, and whether your vehicle can actually deliver them. Claiming what you do not have is penalised as deceptive."],
    "Ad budget":["Media spend this quarter","Returns diminish. Doubling spend does not double awareness. Spend enough to be noticed in your segment, then put the money into the product."],
    "Allocation across segments":["Where the ad money goes","Must total 100%. Money aimed at a segment you did not design for is money spent making people reject you."],
 
    "Experience centres":["Retail presence","Rs. 40 L to open and a running cost every quarter thereafter. More centres mean more walk-ins, but an under-staffed centre converts badly and still costs you full price."],
    "Sales staff":["Sales headcount","Converts walk-ins into sales. Too few and you lose customers who arrived ready to buy. Too many and you carry payroll against traffic that is not there."],
    "Sales staff package":["Pay relative to industry","Judged against what every other firm is paying this quarter, not against a fixed number. Paying the median means average productivity, whatever the rupee figure."],
    "Plant workers package":["Pay relative to benchmark","Drives manufacturing productivity, which is one of the nine scorecard measures. Cutting it is the classic false economy in this simulation."],
 
    "Category demand forecast":["Your production plan","Everything downstream follows this number. Forecast too low and you stock out, losing sales and goodwill. Too high and you carry inventory you paid to build."],
    "Expand capacity":["Buying more plant","Capacity bought this quarter is available next quarter, so it must be ordered before you need it. Unused capacity is charged against you."],
    "Quality improvement spend":["Reliability programme","Cuts failure rates and warranty cost, and lifts the reliability judgment that feeds manufacturing productivity. Effects build over several quarters, so starting late wastes the money."],
 
    "Bank credit line":["Short-term borrowing","Limited by your equity. Cheaper than an emergency loan, which is drawn automatically at punitive interest if your cash closes negative."],
    "Issue 5-year bond":["Long-term debt","Cheaper than equity and does not dilute you, but it raises financial risk, which is scored. There is a limit tied to your equity."],
    "Ask":["Capital requested","Ask for what the plan needs. Too little and you cannot execute it. Too much and the partners question whether you understand your own business."],
    "Equity offered":["Share of the company","This sets your valuation. Offering more equity for the same money means you are worth less. Work out the implied valuation before you submit."],
 
    "Market size / quarter":["Total units available","Scale this with the number of firms, not the number of students. Too large and nobody has to compete."],
    "Quarters":["Length of the game","Eight for a single session or a compact exercise. Twelve or more for a term-long league."],
    "VC round in quarter":["When funding opens","Teams need enough trading history to have something to show. Quarter 5 is the usual choice."],
    "Fee":["Licence fee","What you charge a rival for your technology. They can refuse. Price it against what it saves them, not what it cost you."],
    "Universe ID":["Your section's code","Given to you by your instructor along with the join code."],
    "Join code":["Your section's password","Both this and the Universe ID are needed to join."]
  };
 
  function findTip(txt){
    txt = (txt||"").trim();
    if (TIPS[txt]) return TIPS[txt];
    for (var k in TIPS) if (txt.indexOf(k) === 0) return TIPS[k];
    return null;
  }
 
  var pop = document.createElement("div");
  pop.className = "evl-pop";
  document.body.appendChild(pop);
 
  function show(el, tip){
    pop.innerHTML = "<b>" + tip[0] + "</b>" + tip[1];
    pop.classList.add("on");
    var r = el.getBoundingClientRect();
    var top = r.bottom + 8, left = Math.min(r.left, window.innerWidth - 305);
    if (top + pop.offsetHeight > window.innerHeight) top = r.top - pop.offsetHeight - 8;
    pop.style.top = Math.max(8, top) + "px";
    pop.style.left = Math.max(8, left) + "px";
  }
  function hide(){ pop.classList.remove("on"); }
  document.addEventListener("scroll", hide, true);
 
  var lastTier = {};
 
  function enhance(){
    /* --- tooltips on every labelled field --- */
    var labels = document.querySelectorAll("label.f:not([data-evl])");
    for (var i = 0; i < labels.length; i++){
      var L = labels[i];
      L.setAttribute("data-evl", "1");
      var tip = findTip(L.textContent);
      if (!tip) continue;
      var q = document.createElement("span");
      q.className = "evl-q"; q.textContent = "?";
      (function(el, t){
        el.addEventListener("mouseenter", function(){ show(el, t); });
        el.addEventListener("mouseleave", hide);
        el.addEventListener("click", function(e){
          e.preventDefault(); e.stopPropagation();
          if (pop.classList.contains("on")) hide(); else show(el, t);
        });
      })(q, tip);
      L.appendChild(q);
    }
 
    /* --- tier bar under each component dropdown --- */
    if (typeof CATALOG === "undefined") return;
    var sels = document.querySelectorAll(".cfgrow select:not([data-evl])");
    for (var j = 0; j < sels.length; j++){
      (function(S){
        S.setAttribute("data-evl", "1");
        var oc = S.getAttribute("onchange") || "";
        var m = oc.match(/setCfg\((\d+),'([^']+)'/);
        if (!m) return;
        var mi = m[1], cat = m[2], c = CATALOG[cat];
        if (!c) return;
 
        var wrap = document.createElement("div");
        wrap.className = "evl-tier";
        var bar = document.createElement("div"); bar.className = "evl-bar";
        for (var k = 0; k < c.opts.length; k++) bar.appendChild(document.createElement("i"));
        var lab = document.createElement("div"); lab.className = "evl-lab";
        wrap.appendChild(bar); wrap.appendChild(lab);
        S.parentNode.appendChild(wrap);
 
        function paint(flash){
          var sorted = c.opts.slice().sort(function(a,b){ return a.cost - b.cost; });
          var tier = 1;
          for (var k = 0; k < sorted.length; k++) if (sorted[k].id === S.value) tier = k + 1;
          var bits = bar.children;
          for (var k = 0; k < bits.length; k++)
            bits[k].className = (k < tier) ? "on" : "";
          var key = mi + "|" + cat, prev = lastTier[key];
          lab.className = "evl-lab";
          lab.textContent = "Tier " + tier + " of " + c.opts.length +
            (tier === c.opts.length ? " · highest spec" : tier === 1 ? " · lowest spec" : "");
          if (flash && prev !== undefined && prev !== tier){
            var up = tier > prev;
            lab.className = "evl-lab " + (up ? "up" : "down");
            lab.textContent = (up ? "UPGRADED" : "DOWNGRADED") + " · tier " + prev + " to " + tier;
            setTimeout(function(){ paint(false); }, 2000);
          }
          lastTier[key] = tier;
        }
 
        S.addEventListener("change", function(){ setTimeout(function(){ paint(true); }, 60); });
        paint(false);
      })(sels[j]);
    }
  }
 
  setInterval(enhance, 600);
  enhance();
})();
</script>
</body>
</html>
